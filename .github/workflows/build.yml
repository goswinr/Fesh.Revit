name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # to allow manual triggering of the workflow from the GitHub Actions tab:
  workflow_dispatch:

# the build only reads the repository
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the MSBuild tasks of NuGet packages run later must not read GITHUB_TOKEN from .git/config
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'

      # Fesh.Revit and Fesh.Revit.Bootstrapper, they don't reference each other
      - name: Build Fesh.Revit.sln
        run: dotnet build Fesh.Revit.sln --configuration Release



